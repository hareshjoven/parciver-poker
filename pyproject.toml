[project]
name = "parciver"
version = "0.1.0"
description = "A CFR-trained heads-up No-Limit Texas Hold'em bot: Rust MCCFR blueprint, GPU real-time subgame search, exact-exploitability validation ladder"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Haresh Joven" }]
urls = { Repository = "https://github.com/hareshjoven/parciver-poker" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Games/Entertainment",
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
]

[project.scripts]
parciver = "parciver.cli:main"

[project.optional-dependencies]
# The GPU / neural half (real-time search, value nets). Install torch from the CUDA
# index matching your driver, then: pip install -e ".[gpu]"
gpu = [
    "torch>=2.14",
    "triton-windows>=3.8; sys_platform == 'win32'",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# GTO Wizard bench: check its TLS certificate with the operating system's verifier
gtow = [
    "truststore>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parciver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
# Correctness lints (pyflakes + the pycodestyle error classes). Style-only rules that the
# compact numeric code deliberately breaks (one-line statements, `l` for a length, lambdas
# as local helpers, imports after sys.path edits) are off rather than churned.
select = ["E", "F"]
ignore = ["E501", "E701", "E702", "E731", "E741", "E402"]
