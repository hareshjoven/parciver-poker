name: Bug report
description: The program ran but did something wrong (a wrong rule, a crash mid-game, a wrong number).
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What went wrong
      description: Say what you did, what you expected and what you saw.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: The exact command, and `--seed N` if you used one (a seed makes the deals repeatable).
      render: text
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `parciver doctor`
      render: text
    validations:
      required: true
